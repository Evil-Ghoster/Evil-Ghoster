<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="240" viewBox="0 0 1200 240" role="img" aria-label="Ghoster - Product Owner, DevOps Engineer, Fullstack and AI Developer" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0D1117"/>
      <stop offset="55%" stop-color="#1F6FEB"/>
      <stop offset="100%" stop-color="#58A6FF"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#FFFFFF" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>
    <style>
      .name { font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; font-weight: 700; font-size: 68px; fill: #FFFFFF; letter-spacing: 2px; }
      .role { font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; font-size: 20px; fill: #E6EDF3; letter-spacing: 1px; }
      .fade { opacity: 0; animation: fade 1.2s ease-out forwards; }
      .d2 { animation-delay: .4s; }
      @keyframes fade { to { opacity: 1; } }
    </style>
  </defs>
  <rect width="1200" height="240" fill="url(#bg)"/>
  <rect width="1200" height="240" fill="url(#grid)"/>
  <text x="600" y="115" text-anchor="middle" class="name fade">Ghoster</text>
  <text x="600" y="165" text-anchor="middle" class="role fade d2">Product Owner  |  DevOps Engineer  |  Fullstack &amp; AI Developer</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
